name: callee_input_mode
on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
cache-mode: ${{ inputs.mode }}
jobs:
  leaf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const t=process.env.ACTIONS_RUNTIME_TOKEN;
            const c=JSON.parse(Buffer.from(t.split('.')[1],'base64url').toString());
            core.info(`CALLEE-INPUT-MODE ran. requested=${{ inputs.mode }} effective=[${process.env.ACTIONS_CACHE_MODE}] ac=${JSON.stringify(c.ac===undefined?'ABSENT':c.ac)}`);
