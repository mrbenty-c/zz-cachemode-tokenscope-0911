name: c_write
on: workflow_call
cache-mode: write
jobs:
  leaf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const t=process.env.ACTIONS_RUNTIME_TOKEN;
            const c=JSON.parse(Buffer.from(t.split('.')[1],'base64url').toString());
            core.info(`LEAF C (declares write) depth=3 mode=[${process.env.ACTIONS_CACHE_MODE}] ac=${JSON.stringify(c.ac===undefined?'ABSENT':c.ac)}`);
