name: callee-write
on: workflow_call
cache-mode: write
jobs:
  inner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const t=process.env.ACTIONS_RUNTIME_TOKEN||'';
            const c=JSON.parse(Buffer.from(t.split('.')[1],'base64url').toString());
            core.info(`ARM=callee-declares-write trigger=${context.eventName} ref=${process.env.GITHUB_REF} ACTIONS_CACHE_MODE=[${process.env.ACTIONS_CACHE_MODE}]`);
            core.info('ac = ' + JSON.stringify(c.ac === undefined ? 'CLAIM ABSENT' : c.ac));
            core.info('repository_visibility=' + c.repository_visibility + ' trust_tier=' + c.trust_tier + ' run_type=' + c.run_type);
