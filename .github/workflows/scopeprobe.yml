name: scopeprobe
on:
  push:
    tags: ['**']
jobs:
  onTag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const t=process.env.ACTIONS_RUNTIME_TOKEN||'';
            const c=JSON.parse(Buffer.from(t.split('.')[1],'base64url').toString());
            core.info(`GITHUB_REF=[${process.env.GITHUB_REF}] GITHUB_REF_NAME=[${process.env.GITHUB_REF_NAME}] GITHUB_REF_TYPE=[${process.env.GITHUB_REF_TYPE}]`);
            core.info(`ACTIONS_CACHE_MODE=[${process.env.ACTIONS_CACHE_MODE}] run_type=${c.run_type} trust_tier=${c.trust_tier}`);
            core.info('ac = ' + JSON.stringify(c.ac === undefined ? 'CLAIM ABSENT' : c.ac));
