name: claimread
on:
  issue_comment:
    types: [created]
jobs:
  baseline_no_mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const t=process.env.ACTIONS_RUNTIME_TOKEN||'';
            const c=JSON.parse(Buffer.from(t.split('.')[1],'base64url').toString());
            core.info(`ARM=baseline-caller-no-mode trigger=${context.eventName} ref=${process.env.GITHUB_REF} ACTIONS_CACHE_MODE=[${process.env.ACTIONS_CACHE_MODE}]`);
            core.info('ac = ' + JSON.stringify(c.ac === undefined ? 'CLAIM ABSENT' : c.ac));
  call_widening_callee:
    uses: ./.github/workflows/callee-write.yml
