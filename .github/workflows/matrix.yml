name: matrix
on: workflow_dispatch
jobs:
  m_read:
    runs-on: ubuntu-latest
    cache-mode: read
    steps: [{uses: actions/checkout@v4}, {uses: ./.github/actions/probe}]
  m_writeonly:
    runs-on: ubuntu-latest
    cache-mode: write-only
    steps: [{uses: actions/checkout@v4}, {uses: ./.github/actions/probe}]
  m_none:
    runs-on: ubuntu-latest
    cache-mode: none
    steps: [{uses: actions/checkout@v4}, {uses: ./.github/actions/probe}]
  m_write:
    runs-on: ubuntu-latest
    cache-mode: write
    steps: [{uses: actions/checkout@v4}, {uses: ./.github/actions/probe}]
